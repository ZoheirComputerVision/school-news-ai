<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز التحكم SaaS | الصوت المحلي</title>
<link rel="stylesheet" href="admin.css">
<style>
:root { --primary: #1a3a5c; --primary-dark: #0f2440; --accent: #c8a951; --accent-light: #e8d48b; --danger: #c0392b; --success: #27ae60; --warning: #f39c12; --gray: #666; --gray-light: #999; --border: #d4c9b8; --bg: #f4f1ea; --white: #fff; --radius: 8px; --shadow: 0 2px 12px rgba(0,0,0,0.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Tajawal, sans-serif; background:var(--bg); color:var(--primary-dark); direction:rtl; }
.container { max-width:1300px; margin:0 auto; padding:20px; }
.header { background:var(--primary); color:var(--white); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--accent); }
.header h1 { font-size:1.3rem; }
.header .back-link { color:var(--accent-light); text-decoration:none; font-size:0.85rem; }
.header .back-link:hover { color:var(--accent); }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin:20px 0; }
.card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
.card .num { font-size:1.8rem; font-weight:800; color:var(--primary); }
.card .label { font-size:0.78rem; color:var(--gray); margin-top:3px; }
.tabs { display:flex; gap:5px; margin:20px 0; flex-wrap:wrap; }
.tab { padding:8px 18px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; font-family:Tajawal,sans-serif; font-size:0.82rem; transition:all 0.3s; }
.tab:hover { border-color:var(--primary); }
.tab.active { background:var(--primary); color:var(--white); border-color:var(--primary); }
.panel { display:none; background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.panel.active { display:block; }
table { width:100%; border-collapse:collapse; font-size:0.85rem; }
th { background:var(--primary); color:var(--white); padding:10px 12px; text-align:right; font-weight:600; }
td { padding:10px 12px; border-bottom:1px solid var(--border); }
tr:hover td { background:var(--bg); }
.badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:0.72rem; font-weight:700; }
.badge.active { background:#d5f5e3; color:var(--success); }
.badge.inactive { background:#fdebd0; color:var(--warning); }
.btn { display:inline-flex; align-items:center; gap:4px; padding:6px 14px; border:none; border-radius:var(--radius); cursor:pointer; font-family:Tajawal,sans-serif; font-size:0.78rem; font-weight:600; transition:all 0.3s; text-decoration:none; }
.btn-sm { padding:4px 10px; font-size:0.72rem; }
.btn-primary { background:var(--primary); color:var(--white); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-success { background:var(--success); color:var(--white); }
.btn-danger { background:var(--danger); color:var(--white); }
.btn-warning { background:var(--warning); color:var(--white); }
.actions { display:flex; gap:4px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:0.8rem; font-weight:600; color:var(--primary); margin-bottom:3px; }
.form-group input, .form-group select { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius); font-family:Tajawal,sans-serif; font-size:0.85rem; }
.form-group input:focus { outline:none; border-color:var(--primary); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
.modal.open { display:flex; }
.modal-content { background:var(--white); border-radius:var(--radius); max-width:600px; width:90%; max-height:85vh; overflow-y:auto; padding:25px; }
.modal-content h2 { font-size:1.1rem; margin-bottom:15px; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:8px; }
.mt-10 { margin-top:10px; }
.text-muted { color:var(--gray-light); font-size:0.78rem; }
.resource-bar { height:8px; border-radius:4px; background:var(--bg); overflow:hidden; margin:4px 0; }
.resource-bar-fill { height:100%; border-radius:4px; background:var(--success); transition:width 0.5s; }
</style>
</head>
<body>
<div class="header">
  <h1>☁️ مركز التحكم SaaS — الصوت المحلي</h1>
  <div><a href="/admin" class="back-link">← العودة إلى لوحة التحكم</a></div>
</div>
<div class="container">

  <!-- Summary Cards -->
  <div class="cards" id="summary-cards">
    <div class="card"><div class="num" id="stat-total">—</div><div class="label">إجمالي المنصات</div></div>
    <div class="card"><div class="num" id="stat-active">—</div><div class="label">نشطة</div></div>
    <div class="card"><div class="num" id="stat-inactive">—</div><div class="label">غير نشطة</div></div>
    <div class="card"><div class="num" id="stat-regions">—</div><div class="label">مناطق جغرافية</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="tab-tenants">🏛️ المنصات</button>
    <button class="tab" data-tab="tab-new">➕ منصة جديدة</button>
    <button class="tab" data-tab="tab-stats">📊 إحصائيات</button>
  </div>

  <!-- Tab: Tenants -->
  <div class="panel active" id="tab-tenants">
    <table><thead>
      <tr><th>#</th><th>الاسم</th><th>الرمز</th><th>المنطقة</th><th>الحالة</th><th>تاريخ الإنشاء</th><th></th></tr>
    </thead><tbody id="tenants-tbody"></tbody></table>
  </div>

  <!-- Tab: New Tenant -->
  <div class="panel" id="tab-new">
    <form id="tenant-form">
      <div class="form-row">
        <div class="form-group"><label>اسم المنصة *</label><input type="text" id="f-name" required></div>
        <div class="form-group"><label>الرمز (slug) *</label><input type="text" id="f-slug" required placeholder="oran" style="direction:ltr;"></div>
      </div>
      <div class="form-group"><label>المنطقة الجغرافية</label><input type="text" id="f-region" placeholder="ولاية ..."></div>
      <button type="submit" class="btn btn-success mt-10">💾 إنشاء المنصة</button>
    </form>
  </div>

  <!-- Tab: Stats -->
  <div class="panel" id="tab-stats">
    <div class="cards" id="stats-cards"></div>
    <h3 style="font-size:0.95rem;color:var(--primary);margin:15px 0 8px;">توزيع المناطق</h3>
    <table><thead><tr><th>المنطقة</th><th>عدد المنصات</th></tr></thead><tbody id="region-tbody"></tbody></table>
  </div>
</div>

<!-- Tenant Config Modal -->
<div class="modal" id="config-modal"><div class="modal-content">
  <h2 id="config-modal-title">⚙️ إعدادات المنصة</h2>
  <form id="config-form">
    <div class="form-row">
      <div class="form-group"><label>عنوان المنصة</label><input type="text" id="c-title"></div>
      <div class="form-group"><label>الشعار</label><input type="text" id="c-slogan"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>رقم الهاتف</label><input type="text" id="c-phone"></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="c-email"></div>
    </div>
    <div class="form-group"><label>العنوان</label><input type="text" id="c-address"></div>
    <div class="form-row">
      <div class="form-group"><label>فيسبوك</label><input type="url" id="c-facebook"></div>
      <div class="form-group"><label>تويتر</label><input type="url" id="c-twitter"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>إنستغرام</label><input type="url" id="c-instagram"></div>
      <div class="form-group"><label>يوتيوب</label><input type="url" id="c-youtube"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>اللون الأساسي</label><input type="color" id="c-primary"></div>
      <div class="form-group"><label>اللون الثانوي</label><input type="color" id="c-secondary"></div>
    </div>
    <button type="submit" class="btn btn-success mt-10">💾 حفظ الإعدادات</button>
    <button type="button" class="btn" onclick="closeConfig()" style="margin-right:8px;">❌ إلغاء</button>
  </form>
</div></div>

<script>
const API = '/api/tenants';
let currentConfigTenantId = null;

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) { let msg; try { const e = await res.json(); msg = e.error; } catch { msg = res.statusText; } throw new Error(msg); }
  return res.json();
}

async function loadAll() {
  await loadTenants();
  await loadStats();
}

async function loadTenants() {
  try {
    const data = await api('');
    const tbody = document.getElementById('tenants-tbody');
    if (!data.tenants || !data.tenants.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--gray);padding:30px;">لا توجد منصات</td></tr>';
      return;
    }
    tbody.innerHTML = data.tenants.map(t => `
      <tr>
        <td>${t.id}</td>
        <td><strong>${t.name}</strong></td>
        <td style="direction:ltr;font-size:0.75rem;">${t.slug}</td>
        <td>${t.region || '—'}</td>
        <td><span class="badge ${t.status}">${t.status === 'active' ? 'نشطة' : 'غير نشطة'}</span></td>
        <td style="font-size:0.75rem;">${t.created_at ? t.created_at.split('T')[0] : '—'}</td>
        <td class="actions">
          <button class="btn btn-primary btn-sm" onclick="openConfig(${t.id})">⚙️</button>
          ${t.status === 'active' ? `<button class="btn btn-warning btn-sm" onclick="deactivateTenant(${t.id})">⏸ إيقاف</button>` : `<button class="btn btn-success btn-sm" onclick="activateTenant(${t.id})">▶ تفعيل</button>`}
        </td>
      </tr>
    `).join('');
  } catch (e) { console.error('Tenants error:', e); }
}

async function loadStats() {
  try {
    const s = await api('/stats');
    document.getElementById('stat-total').textContent = s.total || 0;
    document.getElementById('stat-active').textContent = s.active || 0;
    document.getElementById('stat-inactive').textContent = s.inactive || 0;
    document.getElementById('stat-regions').textContent = Object.keys(s.by_region || {}).length;

    const regionTbody = document.getElementById('region-tbody');
    const regions = s.by_region || {};
    if (Object.keys(regions).length) {
      regionTbody.innerHTML = Object.entries(regions).map(([region, count]) =>
        `<tr><td>${region}</td><td>${count}</td></tr>`
      ).join('');
    } else {
      regionTbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:var(--gray);">لا توجد بيانات</td></tr>';
    }
  } catch (e) { console.error('Stats error:', e); }
}

async function activateTenant(id) {
  try { await api(`/activate/${id}`, { method: 'POST' }); await loadAll(); } catch (e) { alert(e.message); }
}
async function deactivateTenant(id) {
  try { await api(`/deactivate/${id}`, { method: 'POST' }); await loadAll(); } catch (e) { alert(e.message); }
}

async function openConfig(id) {
  currentConfigTenantId = id;
  document.getElementById('config-modal-title').textContent = '⚙️ إعدادات المنصة #' + id;
  try {
    const data = await api(`/${id}/config`);
    const cfg = data.config || {};
    document.getElementById('c-title').value = cfg.title || '';
    document.getElementById('c-slogan').value = cfg.slogan || '';
    document.getElementById('c-phone').value = cfg.contact_phone || '';
    document.getElementById('c-email').value = cfg.contact_email || '';
    document.getElementById('c-address').value = cfg.address || '';
    document.getElementById('c-facebook').value = cfg.facebook_url || '';
    document.getElementById('c-twitter').value = cfg.twitter_url || '';
    document.getElementById('c-instagram').value = cfg.instagram_url || '';
    document.getElementById('c-youtube').value = cfg.youtube_url || '';
    document.getElementById('c-primary').value = cfg.primary_color || '#1a3a5c';
    document.getElementById('c-secondary').value = cfg.secondary_color || '#c8a951';
  } catch { /* use defaults */ }
  document.getElementById('config-modal').classList.add('open');
}
function closeConfig() { document.getElementById('config-modal').classList.remove('open'); currentConfigTenantId = null; }

document.getElementById('config-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentConfigTenantId) return;
  try {
    await api(`/${currentConfigTenantId}/config`, {
      method: 'PUT',
      body: JSON.stringify({
        title: document.getElementById('c-title').value,
        slogan: document.getElementById('c-slogan').value,
        contact_phone: document.getElementById('c-phone').value,
        contact_email: document.getElementById('c-email').value,
        address: document.getElementById('c-address').value,
        facebook_url: document.getElementById('c-facebook').value,
        twitter_url: document.getElementById('c-twitter').value,
        instagram_url: document.getElementById('c-instagram').value,
        youtube_url: document.getElementById('c-youtube').value,
        primary_color: document.getElementById('c-primary').value,
        secondary_color: document.getElementById('c-secondary').value,
      }),
    });
    closeConfig();
    alert('✅ تم حفظ الإعدادات');
  } catch (e) { alert(e.message); }
});

document.getElementById('tenant-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/create', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('f-name').value,
        slug: document.getElementById('f-slug').value,
        region: document.getElementById('f-region').value,
      }),
    });
    document.getElementById('tenant-form').reset();
    await loadAll();
    document.querySelector('[data-tab="tab-tenants"]').click();
    alert('✅ تم إنشاء المنصة');
  } catch (e) { alert(e.message); }
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('open'); });
});

loadAll();
</script>
</body>
</html>
