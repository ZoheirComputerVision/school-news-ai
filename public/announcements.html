<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعلانات | الصوت المحلي</title>
  <link rel="stylesheet" href="/css/newspaper.css">

</head>
<body>
  <div class="np-top-bar"><div class="container"><span class="date">📅 <span id="np-date"></span></span><span class="edition">الصوت المحلي</span></div></div><div id="global-search" style="display:none"></div>

  <div id="main-nav"></div>

    <div id="np-category-content"></div>

  <script src="/js/api.js"></script>
  <script src="/js/newspaper.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { document.getElementById('np-date').textContent = new Date().toLocaleDateString('ar-DZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); NP.loadCategoryPage('announcement'); });</script>
<script src="/js/nav.js"></script></body>
