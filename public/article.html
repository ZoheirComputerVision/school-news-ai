<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الصوت المحلي - ولاية تيارت">
  <title>المقال | الصوت المحلي</title>
  <link rel="stylesheet" href="/css/newspaper.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4F0;</text></svg>">
</head>
<body>
  <div class="np-top-bar">
    <div class="container">
      <span class="date">📅 <span id="np-date"></span></span>
      <span class="edition">الصوت المحلي</span>
    </div>
  </div>
  <header class="np-masthead">
    <div class="container">
      <div class="logo-main" style="font-size:2rem;">الصوت المحلي</div>
      <div class="logo-sub">عرض المقال</div>
    </div>
  </header>
  <nav class="np-nav">
    <div class="container">
      <a href="/">★ رئيسي</a>
      <a href="/news.html">📰 أخبار</a>
      <a href="/activities.html">📈 نشاطات</a>
      <a href="/announcements.html">📢 إعلانات</a>
      <a href="/timeline.html">📅 أرشيف</a>
      <div class="nav-left"><a href="/admin">⚙️ الإدارة</a></div>
    </div>
  </nav>
  <main class="container">
    <div id="article-content">
      <div class="np-loading">جاري تحميل المقال...</div>
    </div>
    <div style="margin:30px 0;text-align:center;">
      <button class="np-btn" onclick="window.history.back()">🔙 العودة</button>
    </div>
  </main>
  <footer class="np-footer">
    <div class="container">
      <div class="voice-line">🎙️ الصوت المحلي</div>
      <h3>🎙️ الصوت المحلي</h3>
      <p>إهتمام محلي ... إلتزام وطني</p>
    </div>
  </footer>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('np-date').textContent = new Date().toLocaleDateString('ar-DZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || window.location.pathname.split('/').pop();
      if (!id || id === 'article.html') {
        document.getElementById('article-content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--np-gray);">⚠️ المقال غير موجود</div>';
        return;
      }
      try {
        const item = await API.getContentById(id);
        const catNames = { news: '📰 خبر', activity: '📈 نشاط', announcement: '📢 إعلان', uncategorized: '❓ غير مصنف' };
        const date = item.event_date || (item.published_at ? item.published_at.split('T')[0] : (item.created_at ? item.created_at.split('T')[0] : ''));
        const bodyHtml = (item.body || '').replace(/\n\n—/g, '<hr>').replace(/\n/g, '<br>');
        document.getElementById('article-content').innerHTML = `
          <article class="np-article">
            <div class="article-category">${catNames[item.category] || item.category} ${item.is_ai_generated ? '| 🧠 AI' : ''}</div>
            <h1>${item.title}</h1>
            <div class="article-meta">
              <span>📅 ${date}</span>
              <span>📡 ${item.source_name || 'غير محدد'}</span>
              ${item.overall_score ? `<span>🎯 ${Math.round(item.overall_score * 100)}%</span>` : ''}
              <span>👁 <span id="view-count">${item.view_count || 0}</span></span>
            </div>
            ${item.image_data ? `<div class="article-image"><img src="${item.image_data}" alt="${item.title}"></div>` : ''}
            ${item.image_url && !item.image_data ? `<div class="article-image"><img src="${item.image_url}" alt="${item.title}"></div>` : ''}
            <div class="article-body">${bodyHtml}</div>
            <div class="article-footer">
              <p>🆔 #${item.id} ${item.writer_version ? `| 🤖 ${item.writer_version}` : ''} ${item.reviewed_by ? `| 👤 ${item.reviewed_by}` : ''}</p>
            </div>
          </article>`;
        document.title = `${item.title} | الصوت المحلي`;
        API.trackView(id).then(r => { const el = document.getElementById('view-count'); if (el) el.textContent = r.view_count; }).catch(() => {});
      } catch (e) {
        document.getElementById('article-content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--np-gray);">⚠️ فشل تحميل المقال</div>';
      }
    }
    loadArticle();
  </script>
</body>
</html>
