<!DOCTYPE html>

<body>

  <footer class="np-footer"><div class="container"><div class="voice-line">🎙️ الصوت المحلي</div><h3>🏫 ثانوية المجاهد خليل محمد المدعو يوسف</h3><p>عين كرمس — ولاية تيارت</p></div></footer>
  <script src="/js/api.js"></script>
  <script src="/js/newspaper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('np-date').textContent = new Date().toLocaleDateString('ar-DZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const params = new URLSearchParams(window.location.search);
      const section = params.get('s');
      const names = { sports: '⚽ الرياضة', culture: '🎭 الثقافة', science: '🔬 العلوم', literature: '📖 الأدب', opinion: '🗣️ الرأي', guidance: '🧑‍🏫 التوجيه', students: '🎓 الطلبة', education: '🏛️ التربية' };
      const sectionName = names[section] || 'القسم';
      document.getElementById('section-title').textContent = sectionName;
      document.title = sectionName + ' | الصوت المحلي';
      NP.loadCategoryPage(section);
    });
  </script>
</body>
</html>
