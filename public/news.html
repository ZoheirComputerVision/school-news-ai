<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الأخبار - الصوت المحلي - ولاية تيارت">
  <title>الأخبار | الصوت المحلي</title>
  <link rel="stylesheet" href="/css/newspaper.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4F0;</text></svg>">
</head>
<body>
  <div class="np-top-bar">
    <div class="container">
      <span class="date">📅 <span id="np-date"></span></span>
      <span class="edition">الصوت المحلي</span>
      <div id="global-search" style="display:none"></div>
    </div>
  </div>
  <header class="np-masthead">
    <div class="container">
      <div class="logo-main" style="font-size:2rem;">الصوت المحلي</div>
      <div class="logo-sub">قسم الأخبار</div>
    </div>
  </header>
  <div id="main-nav"></div>

  <div id="news-ticker" style="display:none"></div>
  <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
  <main class="container">
    <div class="np-category-header">
      <h1>📰 الأخبار</h1>
      <p>آخر المستجدات والأخبار التربوية في ولاية تيارت</p>
    </div>
    <div class="np-search-box">
      <input type="text" id="np-search-input" placeholder="🔍 بحث في الأخبار...">
      <button id="np-search-btn">بحث</button>
    </div>
    <div id="np-search-results"></div>
    <hr class="np-rule">
    <div id="np-category-content"></div>
  </main>
  <footer class="np-footer">
    <div class="container">
      <div class="voice-line">🎙️ الصوت المحلي</div>
      <h3>🎙️ الصوت المحلي</h3>
      <p>إهتمام محلي ... إلتزام وطني</p>
    </div>
  </footer>
  <script src="/js/api.js"></script>
  <script src="/js/newspaper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('np-date').textContent = new Date().toLocaleDateString('ar-DZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      NP.loadCategoryPage('news');
      NP.initSearch();
    });
  </script>
  <script src="/js/nav.js"></script>
</body>
</html>
